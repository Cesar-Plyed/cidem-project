name: Nightly QA

# Corre la suite completa cada noche contra el stack real (Docker) y abre un
# issue por cada check que falle. También se puede lanzar a mano.
on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC = 01:00 America/Mexico_City
  workflow_dispatch: {}

concurrency:
  group: nightly-qa
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  qa:
    name: Suite QA + triage
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: 'true'
      # Valores falsos: solo para que el stack arranque en CI.
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      ADMIN_REGISTRATION_CODE: ci-admin-code
      PROFESOR_REGISTRATION_CODE: ci-profesor-code
      POSTGRES_PASSWORD: ci_postgres_password
      SECURITY_RATE_LIMIT_MAX_ATTEMPTS: '100'
      E2E_BASE_URL: http://localhost:8081
      E2E_API_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: integrity-core/pom.xml

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: integrity-core-fr/package-lock.json

      - name: Permisos de scripts
        run: chmod +x scripts/*.sh integrity-core/mvnw

      - name: Levantar el stack
        run: ./scripts/dev-up.sh

      - name: Dependencias y navegador para E2E
        working-directory: integrity-core-fr
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Suite QA (tests, lint, build, smoke, E2E)
        run: ./scripts/qa.sh --triage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Logs del stack (si algo falló)
        if: failure()
        run: docker compose logs --tail=200

      - name: Subir artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts
          path: qa-artifacts/
          retention-days: 14
          if-no-files-found: warn
