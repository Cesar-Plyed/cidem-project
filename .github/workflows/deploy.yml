name: Deploy a servidor (Tailscale + SSH)

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # permite lanzarlo manualmente desde GitHub también

concurrency:
  group: deploy-main
  cancel-in-progress: false   # nunca cancelar un deploy a medias

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # El runner de GitHub (hosteado, fuera de tu red) necesita unirse
      # temporalmente al tailnet para poder alcanzar la IP/MagicDNS
      # de tu servidor por Tailscale.
      - name: Conectar el runner al tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      - name: Deploy (backend + frontend web)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}          # IP Tailscale (100.x.x.x) o MagicDNS: servidor.tailnet.ts.net
          username: pawner
          key: ${{ secrets.SSH_DEPLOY_KEY }}     # llave privada del deploy key (par de la agregada a authorized_keys)
          port: 22
          script_stop: true
          script: |
            set -e
            cd /srv/app

            echo "== Actualizando código =="
            git fetch origin main
            git reset --hard origin/main

            echo "== Backend (integrity-core) =="
            cd /srv/app/integrity-core
            podman-compose down
            podman-compose up -d --build

            echo "== Frontend (integrity-core-fr) =="
            cd /srv/app/integrity-core-fr
            podman-compose down
            podman-compose up -d --build

            echo "== Limpieza de imágenes viejas =="
            podman image prune -f

            echo "Deploy completado: $(date -u)"

      - name: Resumen
        if: always()
        run: echo "Deploy a main finalizado con estado ${{ job.status }}"