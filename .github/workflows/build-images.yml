# =====================================================================
# Build and Push Docker Images (Backend + Frontend + Tauri)
# Runs on push/PR to main. Pushes to ghcr.io/cidem/.
# =====================================================================
name: Build and Push Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./integrity-core
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/cidem/cidem-backend:latest
            ghcr.io/cidem/cidem-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./integrity-core-fr
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/cidem/cidem-frontend:latest
            ghcr.io/cidem/cidem-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-tauri:
    name: Build Tauri Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Tauri
        uses: docker/build-push-action@v5
        with:
          context: ./integrity-core-fr/src-tauri
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/cidem/cidem-tauri:latest
            ghcr.io/cidem/cidem-tauri:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
