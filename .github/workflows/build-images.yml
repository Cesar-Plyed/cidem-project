# =====================================================================
# Build and Push Docker Images (Backend + Frontend)
# Runs on push/PR to main. Pushes to ghcr.io/<owner>/ on main only.
#
# Nota: no hay imagen Docker de Tauri. La app de escritorio se compila y se
# publica como instalador nativo en el workflow "Tauri Alpha Release"
# (.github/workflows/tauri-alpha.yml); en src-tauri no existe Dockerfile.
# =====================================================================
name: Build and Push Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR exige minúsculas y el owner del repo puede tener mayúsculas:
      # el nombre se calcula en bash, no en una expresión.
      - name: Build backend image
        env:
          PUSH: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cidem-backend"
          docker buildx build \
            --file integrity-core/Dockerfile \
            --tag "$image:latest" \
            --tag "$image:${GITHUB_SHA}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            $([[ "$PUSH" == "true" ]] && echo "--push" || echo "--load") \
            integrity-core

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend image
        env:
          PUSH: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cidem-frontend"
          docker buildx build \
            --file integrity-core-fr/Dockerfile \
            --tag "$image:latest" \
            --tag "$image:${GITHUB_SHA}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            $([[ "$PUSH" == "true" ]] && echo "--push" || echo "--load") \
            integrity-core-fr
