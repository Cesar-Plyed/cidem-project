services:
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: integrity-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-integrity_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres_password}
    ports:
      - "5432:5432"
    volumes:
      - integrity-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-integrity_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - integrity-net

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: integrity-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - integrity-net

  backend:
    build:
      context: ./integrity-core
      dockerfile: Dockerfile
      # El build necesita salir a internet (Maven). Con la red bridge del
      # host deshabilitada, BuildKit no resuelve DNS; host lo evita.
      network: host
    image: localhost/integrity-core:local
    container_name: integrity-core
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-integrity_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres_password}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      JWT_SECRET: ${JWT_SECRET:-change_me_jwt_secret_32_chars}
      ADMIN_REGISTRATION_CODE: ${ADMIN_REGISTRATION_CODE:-change_me_admin_code}
      PROFESOR_REGISTRATION_CODE: ${PROFESOR_REGISTRATION_CODE:-change_me_professor_code}
      # En dev/tests se registran varios usuarios seguidos; el limite de 5/min
      # solo tiene sentido en produccion.
      SECURITY_RATE_LIMIT_MAX_ATTEMPTS: ${SECURITY_RATE_LIMIT_MAX_ATTEMPTS:-100}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:4200}
    ports:
      - "8080:8080"
    networks:
      - integrity-net

  frontend:
    build:
      context: ./integrity-core-fr
      dockerfile: Dockerfile
      # Igual que el backend: npm ci necesita DNS durante el build.
      network: host
    image: localhost/integrity-core-fr:local
    container_name: integrity-core-fr
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"
    networks:
      - integrity-net

volumes:
  integrity-db-data:
    external: true
    name: postgre-db

networks:
  integrity-net:
    name: integrity-net
    driver: bridge
