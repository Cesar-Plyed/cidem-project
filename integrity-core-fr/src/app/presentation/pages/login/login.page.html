<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Iniciar sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <ion-list lines="full">
      <ion-item>
        <ion-input
          label="Correo"
          labelPlacement="floating"
          type="email"
          formControlName="email"
          autocomplete="email"
          inputmode="email"
        ></ion-input>
      </ion-item>
      <ion-text color="danger" *ngIf="email.touched && email.invalid">
        <p class="field-error" *ngIf="email.errors?.['required']">El correo es obligatorio.</p>
        <p class="field-error" *ngIf="email.errors?.['email']">Ingresa un correo válido.</p>
      </ion-text>

      <ion-item>
        <ion-input
          label="Contraseña"
          labelPlacement="floating"
          type="password"
          formControlName="password"
          autocomplete="current-password"
        ></ion-input>
      </ion-item>
      <ion-text color="danger" *ngIf="password.touched && password.invalid">
        <p class="field-error">La contraseña es obligatoria.</p>
      </ion-text>
    </ion-list>

    <ion-text color="danger" *ngIf="errorMessage">
      <p class="form-error">{{ errorMessage }}</p>
    </ion-text>

    <ion-button expand="block" type="submit" class="ion-margin-top" [disabled]="loading">
      <ion-spinner *ngIf="loading" name="crescent" slot="start"></ion-spinner>
      <span *ngIf="!loading">Entrar</span>
      <span *ngIf="loading">Entrando...</span>
    </ion-button>

    <p class="register-link">
      ¿No tienes cuenta? <a routerLink="/register">Regístrate</a>
    </p>
  </form>
</ion-content>
