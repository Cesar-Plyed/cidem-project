server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión para que cargue más rápido, importante con servidor limitado
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/x-javascript text/xml application/xml
               application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Cache agresivo para archivos con hash en el nombre (los que genera Angular build)
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca se cachea (para que las actualizaciones lleguen al instante)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Clave para Angular/Ionic (SPA con routing en el cliente):
    # cualquier ruta que no exista como archivo cae a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}