# =====================================================================
# Production deployment configuration for CIDEM Integrity
# Uses the shared 'integrity-net' network from docker-compose.yml
# =====================================================================
version: "3.9"
services:
  nginx:
    image: nginx:1.25
    ports:
      - "443:443"
    volumes:
      - ./nginx/cidem-integrity.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/ssl/certs:ro
      - ./private:/etc/ssl/private:ro
    depends_on:
      - frontend
      - backend
    networks:
      - integrity-net
    restart: unless-stopped

  frontend:
    image: cidem-frontend:latest
    expose:
      - "8081"
    environment:
      - API_URL=/api/
    networks:
      - integrity-net
    restart: unless-stopped

  backend:
    image: cidem-backend:latest
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - integrity-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - integrity-net
    restart: unless-stopped

volumes:
  redis-data:

networks:
  integrity-net:
    external: true
