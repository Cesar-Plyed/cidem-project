spring:
  jackson:
    # Jackson 3 (Spring Boot 4) activa FAIL_ON_NULL_FOR_PRIMITIVES por defecto;
    # los DTOs usan primitivos y los clientes omiten flags opcionales.
    deserialization:
      fail-on-null-for-primitives: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate    # las migraciones las maneja Flyway, no Hibernate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never   # no exponer detalles internos en producción

sentinel:
  escalation:
    tab-switch-window: 300s      # 5 min
    focus-loss-window: 60s       # 1 min
    disconnection-window: 300s   # 5 min
    copy-paste-window: 120s      # 2 min

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 30
  registration-codes:
    administrativo: ${ADMIN_REGISTRATION_CODE}
    profesor: ${PROFESOR_REGISTRATION_CODE}