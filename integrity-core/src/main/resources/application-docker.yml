spring:
  jpa:
    hibernate:
      ddl-auto: validate    # las migraciones las maneja Flyway, no Hibernate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never   # no exponer detalles internos en producción

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000      # 15 min en ms
  refresh-token-expiration: 604800000  # 7 días en ms