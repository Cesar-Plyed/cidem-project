spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate    # las migraciones las maneja Flyway, no Hibernate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never   # no exponer detalles internos en producción

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 30
  registration-codes:
    administrativo: ${ADMIN_REGISTRATION_CODE}
    profesor: ${PROFESOR_REGISTRATION_CODE}