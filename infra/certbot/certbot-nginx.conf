# =====================================================================
# Certbot + Nginx SSL certificate provisioning for CIDEM Integrity
# Usage: certbot certonly --nginx -d cidem-integrity.example.com
# =====================================================================
certbot certonly --nginx \
  -d cidem-integrity.example.com \
  --email admin@example.com \
  --non-interactive \
  --agree-tos

# Recommended cron for auto-renewal (add to /etc/cron.d/cidem-certbot):
# 0 3 * * 1 root certbot renew --quiet --post-hook "systemctl reload nginx"
