services:
  # Antes del primer "docker compose up", crea la carpeta en el HOST:
  #   sudo mkdir -p /opt/proyecto-examenes
  #   sudo chown 1000:1000 /opt/proyecto-examenes   # mismo UID que "pawner" dentro del contenedor
  ssh-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: equipo/ssh-deploy-server:latest
    container_name: ssh-deploy-server
    restart: unless-stopped

    # Necesario para que Podman corra dentro del contenedor (namespaces/cgroups anidados)
    privileged: true
    devices:
      - /dev/fuse

    ports:
      # Publica el 22 solo si el host no lo hace vía Tailscale directamente.
      # Si tu host ya está en el tailnet y quieres exponerlo solo ahí,
      # cambia a: "100.x.x.x:22:22" (IP de Tailscale del host) o quítalo
      # y usa "network_mode: host" en su lugar.
      - "2222:22"

    volumes:
      # Bind mount explícito: la carpeta /opt/proyecto-examenes del HOST
      # es la que se ve como /srv/app DENTRO del contenedor SSH.
      # Es la misma carpeta física en ambos lados (no un volumen "oculto"
      # gestionado por Docker/Podman) — puedes navegarla directo desde el
      # host con `ls /opt/proyecto-examenes`.
      - /opt/proyecto-examenes:/srv/app

    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 16g
        reservations:
          cpus: "2"
          memory: 8g

    # Fallback por si se corre con `docker run`/`docker compose` sin soporte
    # completo de "deploy.resources" (Compose v2 fuera de Swarm a veces lo ignora):
    cpus: 4
    mem_limit: 16g
